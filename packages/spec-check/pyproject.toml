[project]
name = "spec-check"
version = "0.1.0"
description = "Claude Code skill: read-only pre-merge spec review. Compares a feature branch's diff against its Notion spec."
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mindaugas Nakrosis", email = "mindaugasm@intelme.ai" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.scripts]
spec-check = "spec_check.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_check"]

[tool.hatch.build.targets.wheel.force-include]
"src/spec_check/knowledge" = "spec_check/knowledge"
