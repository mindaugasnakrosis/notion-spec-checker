[tool.uv.workspace]
members = ["packages/spec-check"]

[tool.uv.sources]
spec-check = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PL",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0911",
    "PLR0915",
    "B008",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0915", "B011"]
"scripts/**" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
